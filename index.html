<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#102b49">
<title>METEO CILENTO</title>
<style>
body {
  margin: 0;
  font-family: Arial, sans-serif;
  background: linear-gradient(180deg,#102b49,#176b87);
  color: white;
  text-align: center;
}
header { padding: 25px 10px; }
h1 { font-size: 28px; letter-spacing: 2px; }
select {
  padding: 14px;
  border-radius: 12px;
  width: 85%;
  font-size: 17px;
}
.card {
  background: rgba(255,255,255,.13);
  margin: 18px;
  padding: 22px;
  border-radius: 18px;
}
.temp { font-size: 65px; font-weight: bold; }
.info { font-size: 18px; line-height: 2; }
.hourly {
  display: flex;
  overflow-x: auto;
  gap: 12px;
  padding: 15px;
}
.hour {
  min-width: 90px;
  background: rgba(255,255,255,.15);
  border-radius: 14px;
  padding: 12px;
}
</style>
</head>
<body>

<header>
<h1>🌤️ METEO CILENTO</h1>
<p>Il tempo nel cuore del Cilento</p>
</header>

<select id="city" onchange="loadWeather()">
<option value="40.191,15.112">Casal Velino</option>
<option value="40.349,14.994">Agropoli</option>
<option value="40.227,15.263">Ascea</option>
<option value="40.034,15.288">Palinuro</option>
<option value="40.025,15.289">Centola</option>
<option value="40.140,15.235">Vallo della Lucania</option>
<option value="40.173,15.556">Sapri</option>
<option value="40.228,15.264">Velia</option>
</select>

<div class="card">
<h2 id="name">Casal Velino</h2>
<div class="temp" id="temp">--°</div>
<div id="description">Caricamento...</div>
<div class="info">
💧 Pioggia: <span id="rain">--</span><br>
🌬️ Vento: <span id="wind">--</span> km/h<br>
🌡️ Percepita: <span id="feels">--</span>°<br>
☁️ Umidità: <span id="humidity">--</span>%
</div>
</div>

<h2>PREVISIONI ORARIE</h2>
<div class="hourly" id="hourly"></div>

<script>
async function loadWeather() {
 const city = document.getElementById("city");
 const coords = city.value.split(",");
 document.getElementById("name").textContent =
 city.options[city.selectedIndex].text;

 const url = `https://api.open-meteo.com/v1/forecast?latitude=${coords[0]}&longitude=${coords[1]}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m&hourly=temperature_2m,precipitation_probability,weather_code&forecast_days=3&timezone=Europe%2FRome`;

 try {
 const response = await fetch(url);
 const data = await response.json();
 const c = data.current;

 document.getElementById("temp").textContent =
 Math.round(c.temperature_2m)+"°";
 document.getElementById("feels").textContent =
 Math.round(c.apparent_temperature);
 document.getElementById("rain").textContent =
 c.precipitation+" mm";
 document.getElementById("wind").textContent =
 c.wind_speed_10m;
 document.getElementById("humidity").textContent =
 c.relative_humidity_2m;
 document.getElementById("description").textContent =
 weather(c.weather_code);

 const box = document.getElementById("hourly");
 box.innerHTML = "";

 for(let i=0;i<24;i++){
 box.innerHTML += `
 <div class="hour">
 ${data.hourly.time[i].slice(11,16)}<br>
 ${weather(data.hourly.weather_code[i])}<br>
 <b>${Math.round(data.hourly.temperature_2m[i])}°</b><br>
 🌧️ ${data.hourly.precipitation_probability[i]}%
 </div>`;
 }
 } catch(e) {
 document.getElementById("description").textContent =
 "Errore nel caricamento delle previsioni";
 }
}

function weather(code) {
 if(code===0)return "☀️ Sereno";
 if(code<=3)return "🌤️ Nuvoloso";
 if(code<=48)return "🌫️ Nebbia";
 if(code<=67)return "🌧️ Pioggia";
 if(code<=77)return "❄️ Neve";
 if(code<=82)return "🌦️ Rovesci";
 return "⛈️ Temporale";
}

loadWeather();
</script>
</body>
</html>
